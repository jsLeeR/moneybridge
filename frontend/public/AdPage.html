<!DOCTYPE html>

<!-- 임시광고 페이지 -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdPage</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #d4edda;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 80%;
        display: flex;
        align-items: center;
      }
      img {
        max-width: 50%;
        margin-right: 20px;
      }
      h2 {
        margin: 0 0 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="/죽을게.jpg" alt="Logo" />
      <div>
        <h2>공익광고</h2>
        <p>과도한 빚은 당신에게 큰 불행을 안겨줄 수 있습니다.적당히빌려</p>
      </div>
    </div>
  </body>
</html>
